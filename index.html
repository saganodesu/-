<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>株式会社メカワーク | 見積書・請求書システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f7;
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
            padding: 24px 20px;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ヘッダー */
        .corporate-header {
            background: linear-gradient(105deg, #0a2e46 0%, #1c4e6e 100%);
            color: white;
            border-radius: 28px;
            padding: 20px 30px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 12px 18px -8px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        .brand h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .brand small {
            font-size: 0.8rem;
            opacity: 0.85;
            display: block;
            margin-top: 6px;
        }

        .company-address {
            text-align: right;
            font-size: 0.8rem;
            line-height: 1.5;
            background: rgba(255,255,255,0.08);
            padding: 10px 18px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        /* タブ */
        .tab-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .tab {
            background: white;
            border: none;
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            color: #1a3a5c;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .tab.active {
            background: linear-gradient(135deg, #0f3b55, #1f688e);
            color: white;
            box-shadow: 0 8px 18px rgba(0,55,94,0.25);
            transform: translateY(-2px);
        }

        .tab:hover:not(.active) {
            background: #e6f0fa;
            transform: translateY(-1px);
        }

        /* パネル共通 */
        .panel-base {
            display: none;
            background: white;
            border-radius: 28px;
            padding: 28px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .panel-base.active-panel {
            display: block;
        }

        /* テーブル */
        .data-table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e9edf2;
        }

        .modern-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 1000px;
        }

        .modern-table th {
            background: #1e3a5f;
            color: white;
            padding: 14px 8px;
            font-weight: 600;
            text-align: center;
            font-size: 0.85rem;
        }

        .modern-table td {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 6px;
            text-align: center;
            vertical-align: middle;
        }

        .modern-table tr:hover {
            background: #f8fafd;
        }

        .badge-quote {
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .action-group {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .btn-icon {
            border: none;
            background: transparent;
            font-size: 0.7rem;
            padding: 5px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.15s;
        }

        .btn-edit {
            background: #f3c26b;
            color: #2c2c2c;
        }
        .btn-edit:hover { background: #e0a72e; }

        .btn-delete {
            background: #e4616b;
            color: white;
        }
        .btn-delete:hover { background: #c63d48; }

        /* フォーム */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
            margin-bottom: 28px;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cfdfed;
            border-radius: 18px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .input-field:focus {
            border-color: #1f688e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(31,104,142,0.2);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a3a5c;
        }

        .btn-primary {
            background: linear-gradient(95deg, #165a7a, #0d3f58);
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.01);
            background: #0f4b68;
        }

        /* 書類印刷エリア */
        .doc-viewer {
            background: #fefef7;
            border-radius: 24px;
            padding: 26px;
            margin-top: 30px;
            border: 1px solid #e2dcd0;
        }

        .print-style {
            background: white;
        }

        /* 統計カード */
        .stats-dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card-modern {
            background: linear-gradient(115deg, #143e58, #1e5a7c);
            flex: 1;
            min-width: 180px;
            padding: 22px 12px;
            border-radius: 28px;
            color: white;
            text-align: center;
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
        }

        .stat-card-modern h4 {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 8px;
        }

        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }
            .corporate-header, .tab-bar, .btn-primary, .action-group, .btn-icon, .stats-dashboard, .form-grid, #selectDocument, .print-btn, .tab, .data-table-wrapper, #statsTable {
                display: none !important;
            }
            .panel-base, .panel-base.active-panel {
                display: block !important;
                padding: 0;
                background: white;
            }
            .doc-viewer {
                box-shadow: none;
                padding: 0;
                background: white;
            }
            .document-header, .document-table, .total-area {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ヘッダー（企業情報） -->
    <div class="corporate-header">
        <div class="brand">
            <h1>📄 見積書・請求書システム</h1>
            <small>株式会社メカワーク — 確かな技術で物流を支える</small>
        </div>
        <div class="company-address">
            〒551-0003 大阪府大阪市大正区千島2-4UR 千島団地2-611<br>
            TEL：070-3537-4004  /  motoyuki5611@gmail.com<br>
            登録番号：T8120001266455
        </div>
    </div>

    <!-- タブメニュー -->
    <div class="tab-bar">
        <button class="tab active" data-tab="list">📋 一覧表示</button>
        <button class="tab" data-tab="add">➕ 新規登録</button>
        <button class="tab" data-tab="print">🖨️ 書類印刷</button>
        <button class="tab" data-tab="stats">📊 集計ダッシュボード</button>
    </div>

    <!-- パネル1: 一覧表示 -->
    <div id="listPanel" class="panel-base active-panel">
        <div class="data-table-wrapper">
            <table class="modern-table" id="mainDataTable">
                <thead>
                    <tr>
                        <th>ID</th><th>日付</th><th>種別</th><th>顧客名</th><th>車両</th><th>作業内容</th>
                        <th>数量</th><th>単価</th><th>金額(税抜)</th><th>依頼主</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="listTableBody">
                    <!-- 初期データなし -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- パネル2: 新規登録 -->
    <div id="addPanel" class="panel-base">
        <h3 style="margin-bottom: 22px; font-weight: 600;">✨ 新規案件登録</h3>
        <div class="form-grid">
            <div><label>📅 日付</label><input type="date" id="newDate" class="input-field"></div>
            <div><label>📄 書類種別</label><select id="newType" class="input-field"><option>見積書</option><option>請求書</option></select></div>
            <div>
                <label>🏢 顧客名</label>
                <input list="customerList" id="newCustomer" class="input-field" placeholder="例：いすゞ自動車近畿">
                <datalist id="customerList"></datalist>
            </div>
            <div><label>🚛 車両</label><input type="text" id="newVehicle" class="input-field" placeholder="例：大阪100か1234"></div>
            <div><label>🔧 作業内容</label><input type="text" id="newWork" class="input-field" placeholder="例：ラジエーター交換"></div>
            <div><label>👤 依頼主</label><input type="text" id="newRequester" class="input-field" placeholder="例：河合様"></div>
            <div><label>🔢 数量</label><input type="number" id="newQty" class="input-field" value="1" min="1"></div>
            <div><label>💰 単価 (円)</label><input type="number" id="newPrice" class="input-field" value="0" min="0"></div>
            <div><label>🧾 小計金額 (自動)</label><input type="text" id="newAmount" class="input-field" readonly style="background:#f1f5f9;"></div>
        </div>
        <button class="btn-primary" onclick="registerNewRecord()">✅ 登録する</button>
    </div>

    <!-- パネル3: 書類印刷 & プレビュー -->
    <div id="printPanel" class="panel-base">
        <div style="display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 25px;">
            <div style="flex:1">
                <label>🔍 発行する書類を選択 (ID)</label>
                <select id="selectDocument" class="input-field" style="width:100%;"></select>
            </div>
            <div>
                <button class="btn-primary print-btn" onclick="generateDocumentAndPrint()">🖨️ 印刷 / PDF保存</button>
            </div>
        </div>
        <div id="documentDisplay" class="doc-viewer"></div>
    </div>

    <!-- パネル4: 集計 -->
    <div id="statsPanel" class="panel-base">
        <div class="stats-dashboard" id="statsCardsContainer"></div>
        <div class="data-table-wrapper">
            <table class="modern-table" id="summaryByCustomer">
                <thead>
                    <tr><th>顧客名</th><th>発行件数</th><th>合計金額(税抜)</th><th>消費税(10%)</th><th>税込合計</th></tr>
                </thead>
                <tbody id="statsTableBody"></tbody>
            </table>
        </div>
    </div>
</div>
