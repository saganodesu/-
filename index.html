<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>株式会社メカワーク | 見積書・請求書システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f7;
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
            padding: 24px 20px;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        .corporate-header {
            background: linear-gradient(105deg, #0a2e46 0%, #1c4e6e 100%);
            color: white;
            border-radius: 28px;
            padding: 20px 30px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 12px 18px -8px rgba(0,0,0,0.2);
        }

        .brand h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .brand small {
            font-size: 0.8rem;
            opacity: 0.85;
            display: block;
            margin-top: 6px;
        }

        .company-address {
            text-align: right;
            font-size: 0.8rem;
            line-height: 1.5;
            background: rgba(255,255,255,0.08);
            padding: 10px 18px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        .tab-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .tab {
            background: white;
            border: none;
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            color: #1a3a5c;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .tab.active {
            background: linear-gradient(135deg, #0f3b55, #1f688e);
            color: white;
            box-shadow: 0 8px 18px rgba(0,55,94,0.25);
            transform: translateY(-2px);
        }

        .tab:hover:not(.active) {
            background: #e6f0fa;
            transform: translateY(-1px);
        }

        .panel-base {
            display: none;
            background: white;
            border-radius: 28px;
            padding: 28px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
        }

        .panel-base.active-panel {
            display: block;
        }

        .data-table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e9edf2;
            position: relative;
        }

        .resizable-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            table-layout: fixed;
            min-width: 800px;
        }

        .resizable-table th,
        .resizable-table td {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 8px;
            text-align: center;
            vertical-align: middle;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .resizable-table th {
            background: #1e3a5f;
            color: white;
            font-weight: 600;
            position: relative;
            user-select: none;
        }

        .resizable-table th .resize-handle {
            position: absolute;
            right: -3px;
            top: 0;
            width: 8px;
            height: 100%;
            cursor: col-resize;
            background: transparent;
            z-index: 10;
        }

        .resizable-table th .resize-handle:hover,
        .resizable-table th.resizing-active .resize-handle {
            background: rgba(255,255,255,0.5);
        }

        .resizable-table tr:hover {
            background: #f8fafd;
        }

        .badge-quote {
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .action-group {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .btn-icon {
            border: none;
            background: transparent;
            font-size: 0.7rem;
            padding: 5px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.15s;
        }

        .btn-edit {
            background: #f3c26b;
            color: #2c2c2c;
        }
        .btn-edit:hover { background: #e0a72e; }

        .btn-delete {
            background: #e4616b;
            color: white;
        }
        .btn-delete:hover { background: #c63d48; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
            margin-bottom: 28px;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cfdfed;
            border-radius: 18px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .input-field:focus {
            border-color: #1f688e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(31,104,142,0.2);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a3a5c;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-primary {
            background: linear-gradient(95deg, #165a7a, #0d3f58);
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.01);
            background: #0f4b68;
        }

        .doc-viewer {
            background: #fefef7;
            border-radius: 24px;
            padding: 26px;
            margin-top: 30px;
            border: 1px solid #e2dcd0;
        }

        input.doc-input-field {
            border: none;
            border-bottom: 1px solid #ccc;
            padding: 2px 5px;
            background: transparent;
            font-size: inherit;
            font-weight: inherit;
        }
        input.doc-input-field:focus {
            outline: none;
            border-bottom-color: #1f688e;
        }

        .stats-dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card-modern {
            background: linear-gradient(115deg, #143e58, #1e5a7c);
            flex: 1;
            min-width: 180px;
            padding: 22px 12px;
            border-radius: 28px;
            color: white;
            text-align: center;
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
        }

        .stat-card-modern h4 {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 8px;
        }

        body.resizing {
            user-select: none;
            cursor: col-resize;
        }

        /* 印刷用スタイル */
        @media print {
            @page {
                margin: 0;
                size: auto;
            }

            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
            }

            body {
                background: white;
            }

            .corporate-header, .tab-bar, .btn-primary, .action-group, .btn-icon,
            .stats-dashboard, .form-grid, .print-btn, .tab, .data-table-wrapper,
            #statsTable, #editPanel, .print-controls {
                display: none !important;
            }

            .panel-base, .panel-base.active-panel {
                display: block !important;
                padding: 20mm 15mm !important;
                margin: 0 !important;
                background: white;
                box-shadow: none;
                border-radius: 0;
            }

            .doc-viewer {
                padding: 0 !important;
                margin: 0 !important;
                background: white;
                border: none;
                box-shadow: none;
            }

            body, .container, .doc-viewer, .document-invoice {
                margin: 0;
                padding: 0;
            }

            input.doc-input-field {
                border: none !important;
                background: transparent !important;
                -webkit-appearance: none !important;
                appearance: none !important;
                display: inline !important;
                color: black !important;
                padding: 0 !important;
            }

            .document-invoice {
                break-inside: avoid;
            }
        }
    </style>
</head>

        <div class="company-address">

            <div><label>📄 書類種別</label><select id="editType" class="input-field"><option>見積書</option><option>請求書</option></select></div>
            <div><label>🚛 車両</label><input type="text" id="editVehicle" class="input-field"></div>
            <div><label>🔧 作業内容</label><input list="workList" id="editWork" class="input-field"></div>

            <div><label>💰 単価 (円)</label><input type="number" id="editPrice" class="input-field"></div>
            <div><label>🧾 金額 (円)</label><input type="number" id="editAmount" class="input-field">
                <div class="checkbox-group"><input type="checkbox" id="editLinkCalc" checked><label for="editLinkCalc" style="margin:0; font-size:0.85rem;">数量 × 単価 を自動計算する</label></div>
            </div>

        <div style="display:flex; gap:12px;"><button class="btn-primary" onclick="saveEditRecord()">✅ 更新する</button><button class="btn-icon btn-edit" onclick="switchTab('list')" style="background:#eef2f7;">🔙 キャンセル</button></div>

<script>
    // ==================== データ保存 ====================
    let documents = [];

    function loadData() {
        const saved = localStorage.getItem("mekawork_docs_v4");
        if(saved && saved.trim() !== "") {
            try {
                documents = JSON.parse(saved);
                console.log(`✅ ${documents.length}件のデータを読み込みました`);
            } catch(e) { documents = []; }
        } else {
            documents = [];
            console.log("📭 データは空です。新規登録してください");
        }
    }
    
    function saveData() { 
        localStorage.setItem("mekawork_docs_v4", JSON.stringify(documents)); 
    }

    // カラム幅保存
    function saveAllColumnWidths() {
        const tables = document.querySelectorAll('.resizable-table');
        const allWidths = {};
        tables.forEach((table, tableIdx) => {
            const ths = table.querySelectorAll('th');
            const widths = {};
            ths.forEach((th, idx) => {
                const width = th.style.width;
                if (width && width !== 'auto') widths[idx] = width;
            });
            if (Object.keys(widths).length > 0) allWidths[tableIdx] = widths;
        });
        localStorage.setItem("mekawork_column_widths_v3", JSON.stringify(allWidths));
    }

    function loadAllColumnWidths() {
        const saved = localStorage.getItem("mekawork_column_widths_v3");
        if (!saved) return;
        try {
            const allWidths = JSON.parse(saved);
            const tables = document.querySelectorAll('.resizable-table');
            tables.forEach((table, tableIdx) => {
                if (allWidths[tableIdx]) {
                    const ths = table.querySelectorAll('th');
                    ths.forEach((th, idx) => {
                        if (allWidths[tableIdx][idx]) th.style.width = allWidths[tableIdx][idx];
                    });
                }
            });
        } catch(e) {}
    }

    // リサイズ
    function setupResizeHandles() {
        const newHandles = document.querySelectorAll('.resize-handle');
        let currentTh = null, startX = 0, startWidth = 0;

        function onMouseMove(e) {
            if (!currentTh) return;
            const diff = e.clientX - startX;
            let newWidth = startWidth + diff;
            if (newWidth < 35) newWidth = 35;
            currentTh.style.width = newWidth + 'px';
            currentTh.style.minWidth = newWidth + 'px';
        }

        function onMouseUp() {
            if (currentTh) {
                saveAllColumnWidths();
                currentTh.classList.remove('resizing-active');
            }
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            document.body.classList.remove('resizing');
            currentTh = null;
        }

        newHandles.forEach(handle => {
            handle.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                currentTh = handle.parentElement;
                currentTh.classList.add('resizing-active');
                startX = e.clientX;
                startWidth = currentTh.offsetWidth;
                document.body.classList.add('resizing');
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        });
    }

    // 共通
    function formatDateJP(dateStr) { if(!dateStr) return ""; const d = new Date(dateStr); if(isNaN(d.getTime())) return dateStr; return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
    function formatMoney(amount) { if(amount === undefined || amount === null || amount === "") return ""; return amount.toLocaleString('ja-JP') + "円"; }

    function renderListTable() {
        const tbody = document.getElementById("listTableBody");
        if(!tbody) return;
        tbody.innerHTML = "";
        if (documents.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" style="text-align:center; padding:40px;">📭 登録されたデータはありません。新規登録タブから追加してください</td></tr>';
            return;
        }
        const sortedDocs = [...documents].sort((a,b) => new Date(a.date) - new Date(b.date));
        sortedDocs.forEach(doc => {
            const row = tbody.insertRow();
            row.insertCell(0).innerHTML = `<input type="checkbox" class="row-check" data-id="${doc.id}">`;
            row.insertCell(1).innerText = doc.id;
            row.insertCell(2).innerText = formatDateJP(doc.date);
            row.insertCell(3).innerHTML = `<span class="badge-quote">${doc.type}</span>`;
            row.insertCell(4).innerText = doc.vehicle || "—";
            row.insertCell(5).innerText = doc.work || "—";
            row.insertCell(6).innerText = (doc.qty !== null && doc.qty !== undefined) ? doc.qty : "";
            row.insertCell(7).innerText = doc.price ? formatMoney(doc.price) : "";
            row.insertCell(8).innerText = doc.amount ? formatMoney(doc.amount) : "";
            const actionCell = row.insertCell(9);
            actionCell.className = "action-group";
            actionCell.innerHTML = `<button class="btn-icon btn-edit" onclick="editRecordById(${doc.id})">編集</button>
                                    <button class="btn-icon btn-delete" onclick="deleteRecordById(${doc.id})">削除</button>`;
        });
    }

    window.deleteSelected = function() {
        const checks = document.querySelectorAll('.row-check:checked');
        if(checks.length === 0) { alert("削除する項目を選択してください"); return; }
        if(confirm(`選択した${checks.length}件を削除しますか？`)) {
            const delIds = Array.from(checks).map(c => parseInt(c.dataset.id));
            documents = documents.filter(d => !delIds.includes(d.id));
            refreshAll();
        }
    };
    window.deleteRecordById = function(id) { if(confirm("このレコードを削除しますか？")) { documents = documents.filter(d => d.id !== id); refreshAll(); } };

    window.editRecordById = function(id) {
        const doc = documents.find(d => d.id === id);
        if(!doc) return;
        document.getElementById("editId").value = doc.id;
        document.getElementById("editDate").value = doc.date;
        document.getElementById("editType").value = doc.type;
        document.getElementById("editVehicle").value = doc.vehicle || "";
        document.getElementById("editWork").value = doc.work || "";
        document.getElementById("editQty").value = (doc.qty !== undefined && doc.qty !== null) ? doc.qty : "";
        document.getElementById("editPrice").value = doc.price || "";
        document.getElementById("editAmount").value = doc.amount || "";
        switchTab("edit");
    };
    window.saveEditRecord = function() {
        const id = parseInt(document.getElementById("editId").value);
        const doc = documents.find(d => d.id === id);
        if(!doc) return;
        let newQty = document.getElementById("editQty").value ? parseInt(document.getElementById("editQty").value) : null;
        let newPrice = document.getElementById("editPrice").value ? parseInt(document.getElementById("editPrice").value) : null;
        let newAmount = document.getElementById("editAmount").value ? parseInt(document.getElementById("editAmount").value) : null;
        const link = document.getElementById("editLinkCalc").checked;
        if(link && newQty !== null && newPrice !== null && !isNaN(newQty) && !isNaN(newPrice)) newAmount = newQty * newPrice;
        doc.date = document.getElementById("editDate").value;
        doc.type = document.getElementById("editType").value;
        doc.vehicle = document.getElementById("editVehicle").value.trim();
        doc.work = document.getElementById("editWork").value.trim();
        doc.qty = newQty;
        doc.price = newPrice;
        doc.amount = newAmount;
        refreshAll();
        alert("更新しました");
        switchTab("list");
    };

    function autoCalcAmount() { if(!document.getElementById("linkCalc").checked) return; const qty = parseInt(document.getElementById("newQty").value) || 0; const price = parseInt(document.getElementById("newPrice").value) || 0; document.getElementById("newAmount").value = (qty && price) ? qty * price : ""; }
    function autoCalcAmountEdit() { if(!document.getElementById("editLinkCalc").checked) return; const qty = parseInt(document.getElementById("editQty").value) || 0; const price = parseInt(document.getElementById("editPrice").value) || 0; document.getElementById("editAmount").value = (qty && price) ? qty * price : ""; }
    
    window.registerNewRecord = function() {
        let newDate = document.getElementById("newDate").value;
        if(!newDate) { alert("日付を選択してください"); return; }
        let newQty = document.getElementById("newQty").value ? parseInt(document.getElementById("newQty").value) : null;
        let newPrice = document.getElementById("newPrice").value ? parseInt(document.getElementById("newPrice").value) : null;
        let newAmount = document.getElementById("newAmount").value ? parseInt(document.getElementById("newAmount").value) : null;
        const link = document.getElementById("linkCalc").checked;
        if(link && newQty !== null && newPrice !== null && !isNaN(newQty) && !isNaN(newPrice)) newAmount = newQty * newPrice;
        const newId = documents.length > 0 ? Math.max(...documents.map(d=>d.id)) + 1 : 1;
        documents.push({
            id: newId, date: newDate, type: document.getElementById("newType").value,
            vehicle: document.getElementById("newVehicle").value.trim(),
            work: document.getElementById("newWork").value.trim(),
            qty: newQty, price: newPrice, amount: newAmount
        });
        document.getElementById("newVehicle").value = "";
        document.getElementById("newWork").value = "";
        document.getElementById("newQty").value = "";
        document.getElementById("newPrice").value = "";
        document.getElementById("newAmount").value = "";
        refreshAll();
        alert(`✅ 新規ID: ${newId} 登録完了`);
        switchTab("list");
    };

    function renderPrintTable() {
        const tbody = document.getElementById("printSelectBody");
        if(!tbody) return;
        tbody.innerHTML = "";
        if(documents.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">📭 登録されたデータがありません。新規登録してください</td></tr>';
            return;
        }
        // 日付の昇順（古い順）にソートしてから表示
        const sortedDocs = [...documents].sort((a, b) => new Date(a.date) - new Date(b.date));
        sortedDocs.forEach(doc => {
            const row = tbody.insertRow();
            row.insertCell(0).innerHTML = `<input type="checkbox" class="print-check" data-id="${doc.id}">`;
            row.insertCell(1).innerText = formatDateJP(doc.date);
            row.insertCell(2).innerText = doc.type;
            row.insertCell(3).innerText = doc.vehicle || "—";
            row.insertCell(4).innerText = doc.work || "—";
            row.insertCell(5).innerText = doc.qty !== null ? doc.qty : "";
            row.insertCell(6).innerText = doc.price ? formatMoney(doc.price) : "";
            row.insertCell(7).innerText = doc.amount ? formatMoney(doc.amount) : "";
        });
    }

    window.togglePrintAll = function(chk) {
        document.querySelectorAll('.print-check').forEach(c => c.checked = chk.checked);
    };
    
    window.generateDocumentAndPrint = function() {
        const checks = document.querySelectorAll('.print-check:checked');
        if(checks.length === 0) { alert("印刷対象の項目を選択してください"); return; }
        const selectedDocs = Array.from(checks)
            .map(c => documents.find(d => d.id == c.dataset.id))
            .filter(d => d)
            .sort((a, b) => new Date(a.date) - new Date(b.date)); // 印刷時も日付昇順に並べ替え

        const totalAmount = selectedDocs.reduce((sum, d) => sum + (d.amount || 0), 0);
        const tax = Math.floor(totalAmount * 0.1);
        const totalIncTax = totalAmount + tax;
        let recipient = document.getElementById("invoiceRecipient")?.value.trim() || "御中";
        let subject = document.getElementById("invoiceSubject")?.value.trim() || "ご請求書";
        const rowsHtml = selectedDocs.map(doc => `<tr><td style="border:1px solid #999; padding:10px; text-align:center;">${formatDateJP(doc.date)}</td><td style="border:1px solid #999; padding:10px;">${doc.vehicle || ""}</td><td style="border:1px solid #999; padding:10px;">${doc.work || ""}</td><td style="border:1px solid #999; padding:10px; text-align:center;">${doc.qty !== null ? doc.qty : ""}</td><td style="border:1px solid #999; padding:10px; text-align:right;">${doc.price ? formatMoney(doc.price) : ""}</td><td style="border:1px solid #999; padding:10px; text-align:right;">${doc.amount ? formatMoney(doc.amount) : ""}</td></tr>`).join("");
        const docTypeDisplay = selectedDocs[0]?.type || "請求書";
        const previewHtml = `<div class="document-invoice" style="font-family:'Helvetica Neue','Hiragino Kaku Gothic Pro',sans-serif; background:white; width:100%; margin:0; padding:0;"><div style="padding: 0 0 12px 0; margin-bottom: 18px; border-bottom: 2px solid #1e3a5f;"><div style="display:flex; justify-content:space-between; align-items:flex-start;"><div style="font-size:2rem; font-weight:bold; color:#1a3a5c;"><input type="text" class="doc-input-field" value="${docTypeDisplay}" style="font-size:2rem; font-weight:bold; width:150px;"></div><div style="text-align:right; font-size:0.8rem; line-height:1.4;">〒551-0003 大阪府大阪市大正区千島2-4UR 千島団地2-611<br>TEL：070-3537-4004 / motoyuki5611@gmail.com<br>登録番号：T8120001266455<br><span style="font-size:1rem; font-weight:bold;">株式会社メカワーク</span></div></div></div><div style="margin-bottom: 28px;"><div style="font-size:1.4rem; font-weight:bold; margin-bottom: 10px;"><input type="text" class="doc-input-field" value="${recipient}" style="font-size:1.4rem; width:280px; font-weight:bold;"></div><div style="font-size:1.1rem; margin-bottom: 15px; padding-left: 4px; color:#2c3e50;"><input type="text" class="doc-input-field" value="${subject}" style="font-size:1.1rem; width:360px; font-weight:500;"></div><div style="font-size:0.95rem;">下記の通りご請求申し上げます。</div></div><table style="width:100%; border-collapse:collapse; margin-bottom:35px;"><thead><tr style="background:#f0f4f8;"><th style="border:1px solid #999; padding:10px;">日付</th><th style="border:1px solid #999; padding:10px;">車両</th><th style="border:1px solid #999; padding:10px;">作業内容</th><th style="border:1px solid #999; padding:10px;">数量</th><th style="border:1px solid #999; padding:10px;">単価</th><th style="border:1px solid #999; padding:10px;">金額</th></tr></thead><tbody>${rowsHtml}</tbody></table><div style="text-align:right; margin-top:20px; font-size:1rem; border-top:1px solid #ddd; padding-top:20px;"><div>税抜金額計：<strong>${formatMoney(totalAmount)}</strong></div><div>消費税(10%)：<strong>${formatMoney(tax)}</strong></div><div style="font-size:1.5rem; margin-top:8px; color:#b22234;">税込合計金額：<strong>${formatMoney(totalIncTax)}</strong></div></div></div>`;
        document.getElementById("documentDisplay").innerHTML = previewHtml;
        setTimeout(() => { window.print(); }, 100);
    };

    function updateStatsAndDashboard() {
        const totalAmount = documents.reduce((sum, d) => sum + (d.amount || 0), 0);
        const totalTax = Math.floor(totalAmount * 0.1);
        const totalInc = totalAmount + totalTax;
        document.getElementById("statsCardsContainer").innerHTML = `<div class="stat-card-modern"><h4>総件数</h4><div class="stat-number">${documents.length}</div></div><div class="stat-card-modern"><h4>税抜合計</h4><div class="stat-number">${formatMoney(totalAmount)}</div></div><div class="stat-card-modern"><h4>消費税(10%)</h4><div class="stat-number">${formatMoney(totalTax)}</div></div><div class="stat-card-modern"><h4>税込合計</h4><div class="stat-number">${formatMoney(totalInc)}</div></div>`;
        document.getElementById("statsTableBody").innerHTML = `<tr><td colspan="2" style="text-align:center;">合計情報は上記カードを参照ください</td></tr>`;
    }

    function updateSuggestions() {
        const workSet = new Set(documents.map(d => d.work).filter(w => w));
        const datalist = document.getElementById("workList");
        if(datalist) datalist.innerHTML = Array.from(workSet).map(w => `<option value="${w.replace(/"/g, '&quot;')}">`).join("");
    }

    function refreshAll() {
        renderListTable();
        updateSuggestions();
        updateStatsAndDashboard();
        renderPrintTable();
        saveData();
        setTimeout(() => {
            setupResizeHandles();
            loadAllColumnWidths();
        }, 30);
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if(tabName !== 'edit') document.querySelector(`.tab[data-tab="${tabName}"]`)?.classList.add('active');
        document.querySelectorAll('.panel-base').forEach(p => p.classList.remove('active-panel'));
        if(tabName === 'edit') document.getElementById('editPanel').classList.add('active-panel');
        else document.getElementById(`${tabName}Panel`).classList.add('active-panel');
        if(tabName === 'print') renderPrintTable();
        if(tabName === 'stats') updateStatsAndDashboard();
        setTimeout(() => {
            setupResizeHandles();
            loadAllColumnWidths();
        }, 30);
    }

    // イベント
    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', function() { switchTab(this.dataset.tab); }));
    document.getElementById('newQty')?.addEventListener('input', autoCalcAmount);
    document.getElementById('newPrice')?.addEventListener('input', autoCalcAmount);
    document.getElementById('editQty')?.addEventListener('input', autoCalcAmountEdit);
    document.getElementById('editPrice')?.addEventListener('input', autoCalcAmountEdit);

    // 初期化
    loadData();
    refreshAll();
    switchTab('list');
    if(!document.getElementById("newDate").value) document.getElementById("newDate").value = new Date().toISOString().split('T')[0];
</script>
</body>
</html>
