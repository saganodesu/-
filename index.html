<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>株式会社メカワーク | 見積書・請求書システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f7;
            font-family: 'Segoe UI', 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
            padding: 24px 20px;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ヘッダー */
        .corporate-header {
            background: linear-gradient(105deg, #0a2e46 0%, #1c4e6e 100%);
            color: white;
            border-radius: 28px;
            padding: 20px 30px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 12px 18px -8px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        .brand h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .brand small {
            font-size: 0.8rem;
            opacity: 0.85;
            display: block;
            margin-top: 6px;
        }

        .company-address {
            text-align: right;
            font-size: 0.8rem;
            line-height: 1.5;
            background: rgba(255,255,255,0.08);
            padding: 10px 18px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }

        /* タブ */
        .tab-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .tab {
            background: white;
            border: none;
            padding: 12px 26px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            color: #1a3a5c;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .tab.active {
            background: linear-gradient(135deg, #0f3b55, #1f688e);
            color: white;
            box-shadow: 0 8px 18px rgba(0,55,94,0.25);
            transform: translateY(-2px);
        }

        .tab:hover:not(.active) {
            background: #e6f0fa;
            transform: translateY(-1px);
        }

        /* パネル共通 */
        .panel-base {
            display: none;
            background: white;
            border-radius: 28px;
            padding: 28px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            transition: 0.2s;
        }

        .panel-base.active-panel {
            display: block;
        }

        /* テーブル */
        .data-table-wrapper {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #e9edf2;
        }

        .modern-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 1000px;
        }

        .modern-table th {
            background: #1e3a5f;
            color: white;
            padding: 14px 8px;
            font-weight: 600;
            text-align: center;
            font-size: 0.85rem;
        }

        .modern-table td {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 6px;
            text-align: center;
            vertical-align: middle;
        }

        .modern-table tr:hover {
            background: #f8fafd;
        }

        .badge-quote {
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .action-group {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .btn-icon {
            border: none;
            background: transparent;
            font-size: 0.7rem;
            padding: 5px 10px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.15s;
        }

        .btn-edit {
            background: #f3c26b;
            color: #2c2c2c;
        }
        .btn-edit:hover { background: #e0a72e; }

        .btn-delete {
            background: #e4616b;
            color: white;
        }
        .btn-delete:hover { background: #c63d48; }

        /* フォーム */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
            margin-bottom: 28px;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cfdfed;
            border-radius: 18px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .input-field:focus {
            border-color: #1f688e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(31,104,142,0.2);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a3a5c;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-primary {
            background: linear-gradient(95deg, #165a7a, #0d3f58);
            border: none;
            padding: 12px 32px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .btn-primary:hover {
            transform: scale(1.01);
            background: #0f4b68;
        }

        /* 書類印刷エリア */
        .doc-viewer {
            background: #fefef7;
            border-radius: 24px;
            padding: 26px;
            margin-top: 30px;
            border: 1px solid #e2dcd0;
        }

        .print-style {
            background: white;
        }

        /* 統計カード */
        .stats-dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card-modern {
            background: linear-gradient(115deg, #143e58, #1e5a7c);
            flex: 1;
            min-width: 180px;
            padding: 22px 12px;
            border-radius: 28px;
            color: white;
            text-align: center;
            box-shadow: 0 12px 20px rgba(0,0,0,0.1);
        }

        .stat-card-modern h4 {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            margin-top: 8px;
        }

        /* 印刷時編集フォーム */
        .doc-input-field {
            width: 100%;
            border: none;
            border-bottom: 1px solid #999;
            padding: 4px 8px;
            font-size: 1rem;
            background: transparent;
        }
        .doc-input-field:focus {
            outline: none;
            border-bottom-color: #1f688e;
        }

@media print {
    body {
        background: white;
        padding: 0;
        margin: 0;
    }
    /* 印刷時に消したい要素を全部ここに書く */
    .corporate-header, .tab-bar, .btn-primary, .action-group, .btn-icon, .stats-dashboard, .form-grid, #selectDocument, .print-btn, .tab, .data-table-wrapper, #statsTable, label[for="selectDocument"] {
        display: none !important;
    }
    .panel-base, .panel-base.active-panel {
        display: block !important;
        padding: 0;
        background: white;
    }
    .doc-viewer {
        box-shadow: none;
        padding: 0;
        background: white;
    }
    .document-header, .document-table, .total-area {
        break-inside: avoid;
    }
    .doc-input-field {
        border: none;
    }
}
    </style>
</head>
<body>
<div class="container">
    <!-- ヘッダー（企業情報） -->
    <div class="corporate-header">
        <div class="brand">
            <h1>📄 見積書・請求書システム</h1>
            <small>株式会社メカワーク — 確かな技術で物流を支える</small>
        </div>
        <div class="company-address">
            〒551-0003 大阪府大阪市大正区千島2-4UR 千島団地2-611<br>
            TEL：070-3537-4004  /  motoyuki5611@gmail.com<br>
            登録番号：T8120001266455
        </div>
    </div>

    <!-- タブメニュー -->
    <div class="tab-bar">
        <button class="tab active" data-tab="list">📋 一覧表示</button>

    <!-- パネル1: 一覧表示 -->

        <button class="btn-icon btn-delete" onclick="deleteSelected()" style="margin-bottom:10px;">🗑️ 選択した項目を削除</button>
        <div class="data-table-wrapper">
            <table class="modern-table" id="mainDataTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="checkAll" onchange="toggleAll(this)"></th>
                        <th>ID</th><th>日付</th><th>種別</th><th>車両</th><th>作業内容</th>
                        <th>数量</th><th>単価</th><th>金額(税抜)</th><th>依頼主</th><th>操作</th>

                </thead>

    <!-- パネル2: 新規登録 -->
    <div id="addPanel" class="panel-base">

                <label>🔧 作業内容</label>

                <label>🧾 金額 (円)</label>
                <input type="number" id="newAmount" class="input-field" min="0" placeholder="空欄可">
                <div class="checkbox-group">
                    <input type="checkbox" id="linkCalc" checked>
                    <label for="linkCalc" style="margin:0; font-size:0.85rem;">数量 × 単価 を自動計算する</label>
                </div>
            </div>
        </div>
        <button class="btn-primary" onclick="registerNewRecord()">✅ 登録する</button>
    </div>

    <!-- パネル3: 書類印刷 & プレビュー -->
    <div id="printPanel" class="panel-base">
        <div style="display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 25px;">

    <div id="statsPanel" class="panel-base">

            <table class="modern-table" id="summaryByCustomer">
                <thead>
                    <tr><th>顧客名</th><th>発行件数</th><th>合計金額(税抜)</th><th>消費税(10%)</th><th>税込合計</th></tr>
                </thead>
                <tbody id="statsTableBody"></tbody>
            </table>

</div>

<script>
    // ---------- データ保存用 ----------
    let documents = [];

    function loadData() {
        const saved = localStorage.getItem("mekawork_docs");
        if(saved) {
            documents = JSON.parse(saved);
        }
    }

    function saveData() {
        localStorage.setItem("mekawork_docs", JSON.stringify(documents));
    }

    // ヘルパー関数
    function formatDateJP(dateStr) {
        if(!dateStr) return "";
        const d = new Date(dateStr);
        if(isNaN(d.getTime())) return dateStr;
        return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
    }

    function formatMoney(amount) {
        if(amount === undefined || amount === null || amount === "") return "";
        return amount.toLocaleString('ja-JP') + "円";
    }

    // 更新: テーブル + 選択ボックス + 集計 + 候補リスト
    function refreshAll() {
        renderListTable();
        updateSelectOptions();
        updateStatsAndDashboard();
        updateSuggestions();
        saveData();
    }

    function updateSuggestions() {
        const workList = document.getElementById("workList");
        const uniqueWork = [...new Set(documents.map(d => d.work).filter(w => w))];
        workList.innerHTML = uniqueWork.map(w => `<option value="${w}">`).join("");
    }

// 一覧テーブル描画 (日付順ソート)
function renderListTable() {
    const tbody = document.getElementById("listTableBody");
    if(!tbody) return;
    tbody.innerHTML = "";

    // ★ 変更：古い日付が上に来るように並べ替え
    const sortedDocs = [...documents].sort((a, b) => new Date(a.date) - new Date(b.date));

    sortedDocs.forEach(doc => {
        const row = tbody.insertRow();
        // チェックボックス列
        const chkCell = row.insertCell(0);
        chkCell.innerHTML = `<input type="checkbox" class="row-check" data-id="${doc.id}">`;
        
        row.insertCell(1).innerText = doc.id;
        row.insertCell(2).innerText = formatDateJP(doc.date);
        row.insertCell(3).innerHTML = `<span class="badge-quote">${doc.type}</span>`;
        row.insertCell(4).innerText = doc.vehicle || "—";
        row.insertCell(5).innerText = doc.work || "—";
        row.insertCell(6).innerText = doc.qty || "";
        row.insertCell(7).innerText = formatMoney(doc.price);
        row.insertCell(8).innerText = formatMoney(doc.amount);
        row.insertCell(9).innerText = doc.requester || "—";
        
        const actionCell = row.insertCell(10);
        actionCell.className = "action-group";
        actionCell.innerHTML = `<button class="btn-icon btn-edit" onclick="editRecordById(${doc.id})">編集</button>
                                <button class="btn-icon btn-delete" onclick="deleteRecordById(${doc.id})">削除</button>`;
    });
}

    // 全選択・解除
    function toggleAll(chk) {
        const checks = document.querySelectorAll('.row-check');
        checks.forEach(c => c.checked = chk.checked);
    }

    // 選択削除
    function deleteSelected() {
        const checks = document.querySelectorAll('.row-check:checked');
        if(checks.length === 0) {
            alert("削除する項目を選択してください");
            return;
        }
        if(confirm(`選択した${checks.length}件を削除しますか？`)) {
            const delIds = Array.from(checks).map(c => parseInt(c.dataset.id));
            documents = documents.filter(d => !delIds.includes(d.id));
            refreshAll();
        }
    }

// 編集 (全項目編集)
window.editRecordById = function(id) {
    const doc = documents.find(d => d.id === id);
    if(!doc) return;

    // 各項目を入力ダイアログで編集
    const newDate = prompt("日付を入力 (YYYY-MM-DD)", doc.date);
    if(newDate === null) return; // キャンセルされたら何もしない

    const newType = prompt("書類種別 (見積書 / 請求書)", doc.type);
    if(newType === null) return;

    const newVehicle = prompt("車両番号", doc.vehicle || "");
    if(newVehicle === null) return;

    const newWork = prompt("作業内容", doc.work || "");
    if(newWork === null) return;

    const newRequester = prompt("依頼主", doc.requester || "");
    if(newRequester === null) return;

    const newQty = prompt("数量", doc.qty || "");
    if(newQty === null) return;

    const newPrice = prompt("単価 (円)", doc.price || "");
    if(newPrice === null) return;

    const newAmount = prompt("金額 (税抜)", doc.amount || "");
    if(newAmount === null) return;

    // 値を更新
    doc.date = newDate;
    doc.type = newType;
    doc.vehicle = newVehicle;
    doc.work = newWork;
    doc.requester = newRequester;
    doc.qty = newQty === "" ? null : parseInt(newQty);
    doc.price = newPrice === "" ? null : parseInt(newPrice);
    doc.amount = newAmount === "" ? null : parseInt(newAmount);

    refreshAll();
    alert("✅ 内容を更新しました");
};
    // 金額自動計算 連動切替
    function autoCalcAmount() {
        const linkOn = document.getElementById("linkCalc").checked;
        if(!linkOn) return;
        const qty = parseInt(document.getElementById("newQty").value) || 0;
        const price = parseInt(document.getElementById("newPrice").value) || 0;
        document.getElementById("newAmount").value = (qty && price) ? qty * price : "";
    }

    // 新規登録処理
    window.registerNewRecord = function() {
        const newDate = document.getElementById("newDate").value;
        const newType = document.getElementById("newType").value;
        const newVehicle = document.getElementById("newVehicle").value.trim();
        const newWork = document.getElementById("newWork").value.trim();
        const newRequester = document.getElementById("newRequester").value.trim();
        let newQty = document.getElementById("newQty").value ? parseInt(document.getElementById("newQty").value) : null;
        let newPrice = document.getElementById("newPrice").value ? parseInt(document.getElementById("newPrice").value) : null;
        let newAmount = document.getElementById("newAmount").value ? parseInt(document.getElementById("newAmount").value) : null;
        
        if(!newDate) { alert("日付を選択してください"); return; }
        
        const newId = documents.length > 0 ? Math.max(...documents.map(d=>d.id)) + 1 : 1;
        
        documents.push({
            id: newId, date: newDate, type: newType,
            vehicle: newVehicle, work: newWork, qty: newQty,
            price: newPrice, amount: newAmount, requester: newRequester
        });
        
        // フォームリセット
        document.getElementById("newVehicle").value = "";
        document.getElementById("newWork").value = "";
        document.getElementById("newRequester").value = "";
        document.getElementById("newQty").value = "";
        document.getElementById("newPrice").value = "";
        document.getElementById("newAmount").value = "";
        document.getElementById("newDate").value = new Date().toISOString().split('T')[0];
        
        refreshAll();
        alert(`✅ 新規ID: ${newId} を登録しました。`);
        switchTab("list");
    };

    // セレクトボックス更新
    function updateSelectOptions() {
        const select = document.getElementById("selectDocument");
        if(!select) return;
        let options = '<option value="">-- 書類を選択 --</option>';
        documents.forEach(doc => {
            options += `<option value="${doc.id}">${doc.id}: ${formatDateJP(doc.date)} - ${doc.type}</option>`;
        });
        select.innerHTML = options;
    }

    // 印刷用プレビュー作成
window.generateDocumentAndPrint = function() {
    const idVal = document.getElementById("selectDocument").value;
    if(!idVal) { alert("発行する書類のIDを選択してください"); return; }
    const doc = documents.find(d => d.id == idVal);
    if(!doc) return;
    
    const tax = (doc.amount && !isNaN(doc.amount)) ? Math.floor(doc.amount * 0.1) : null;
    const totalIncTax = (doc.amount && tax !== null) ? doc.amount + tax : null;
    
    const previewHtml = `
        <div style="font-family:'Helvetica Neue','Hiragino Kaku Gothic Pro',sans-serif; background:white; padding:12px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
                <div style="flex:1;">
                    <div style="text-align:center; margin-bottom:10px;">
                        <input type="text" class="doc-input-field" value="${doc.type}" style="font-size:2.2rem; font-weight:bold; width:100%; text-align:center;">
                    </div>
                    
                    <!-- 宛名入力欄 -->
                    <div style="font-size:1.2rem; font-weight:bold; margin-bottom:8px;">
                        <input type="text" class="doc-input-field" placeholder="例：〇〇株式会社 御中" style="font-size:1.2rem; font-weight:bold; width:90%;">
                    </div>
                    
                    <!-- 件名入力欄 -->
                    <div style="margin-top:8px; font-size:1.1rem; font-weight:bold;">
                        件名：<input type="text" class="doc-input-field" value="${doc.work || "作業工賃"}" style="width:70%; font-size:1.1rem; font-weight:bold; display:inline-block; margin-left:5px;">
                    </div>
                    
                    <div style="margin-top:15px;">
                        <input type="text" class="doc-input-field" value="下記の通り、${doc.type}申し上げます。" style="width:100%;">
                    </div>
                </div>
                <div style="text-align:right; min-width:280px;">
                    <div style="font-size:1rem;">${formatDateJP(doc.date)}</div>
                    <div style="margin-top:10px;">
                        株式会社メカワーク<br>
                        〒551-0003 大阪府大阪市大正区千島2-4UR 千島団地2-611<br>
                        TEL：070-3537-4004<br>
                        Email: motoyuki5611@gmail.com<br>
                        登録番号：T8120001266455
                    </div>
                </div>
            </div>

            <hr style="border: none; border-top: 2px solid #333; margin:20px 0;">

            <table style="width:100%; border-collapse:collapse; margin:18px 0;">
                <thead>
                    <tr style="background:#eef2fa;">
                        <th style="border:1px solid #ccc; padding:10px; width:12%;">日付</th>
                        <th style="border:1px solid #ccc; padding:10px; width:15%;">車両番号</th>
                        <th style="border:1px solid #ccc; padding:10px; width:25%;">作業内容</th>
                        <th style="border:1px solid #ccc; padding:10px; width:10%;">数量</th>
                        <th style="border:1px solid #ccc; padding:10px; width:13%;">単価</th>
                        <th style="border:1px solid #ccc; padding:10px; width:15%;">金額(税抜)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="border:1px solid #ccc; padding:10px; text-align:center;">${formatDateJP(doc.date)}</td>
                        <td style="border:1px solid #ccc; padding:10px;">${doc.vehicle || ""}</td>
                        <td style="border:1px solid #ccc; padding:10px;">${doc.work || ""}</td>
                        <td style="border:1px solid #ccc; padding:10px; text-align:center;">${doc.qty || ""}</td>
                        <td style="border:1px solid #ccc; padding:10px; text-align:right;">${formatMoney(doc.price)}</td>
                        <td style="border:1px solid #ccc; padding:10px; text-align:right;">${formatMoney(doc.amount)}</td>
                    </tr>
                </tbody>
            </table>

            <div class="total-area" style="text-align:right; margin-top:24px; padding-right:10px;">
                小計: ${formatMoney(doc.amount)}<br>
                消費税(10%): ${formatMoney(tax)}<br>
                <strong style="font-size:1.2rem;">合計(税込): ${formatMoney(totalIncTax)}</strong>
            </div>

        </div>
    `;
    const displayDiv = document.getElementById("documentDisplay");
    if(displayDiv) displayDiv.innerHTML = previewHtml;
    
    setTimeout(() => {
        window.print();
    }, 120);
};
    // 集計 + ダッシュボード
    function updateStatsAndDashboard() {
        const totalAmountSum = documents.reduce((sum,d)=> sum + (d.amount || 0),0);
        const totalTaxSum = Math.floor(totalAmountSum * 0.1);
        const totalWithTax = totalAmountSum + totalTaxSum;
        const totalCount = documents.length;
        const quoteCount = documents.filter(d=> d.type === "見積書").length;
        const invoiceCount = documents.filter(d=> d.type === "請求書").length;
        
        const statsContainer = document.getElementById("statsCardsContainer");
        if(statsContainer){
            statsContainer.innerHTML = `
                <div class="stat-card-modern"><h4>総案件数</h4><div class="stat-number">${totalCount}</div></div>
                <div class="stat-card-modern"><h4>見積書</h4><div class="stat-number">${quoteCount}</div></div>
                <div class="stat-card-modern"><h4>請求書</h4><div class="stat-number">${invoiceCount}</div></div>
                <div class="stat-card-modern"><h4>総合計(税込)</h4><div class="stat-number">${formatMoney(totalWithTax)}</div></div>
            `;
        }
        
        // 顧客別集計
        const customerAgg = new Map();
        documents.forEach(d => {
            const key = d.requester || "未登録";
            if(!customerAgg.has(key)){
                customerAgg.set(key, {count:0, amount:0});
            }
            const rec = customerAgg.get(key);
            rec.count++;
            rec.amount += (d.amount || 0);
        });
        const statsBody = document.getElementById("statsTableBody");
        if(statsBody){
            statsBody.innerHTML = "";
            for(let [cust, data] of customerAgg.entries()){
                const taxVal = Math.floor(data.amount * 0.1);
                const row = statsBody.insertRow();
                row.insertCell(0).innerText = cust;
                row.insertCell(1).innerText = data.count;
                row.insertCell(2).innerText = formatMoney(data.amount);
                row.insertCell(3).innerText = formatMoney(taxVal);
                row.insertCell(4).innerText = formatMoney(data.amount + taxVal);
            }
        }
    }
    
    // タブ切り替え機能
    function switchTab(tabId) {
        document.querySelectorAll(".panel-base").forEach(panel => panel.classList.remove("active-panel"));
        document.querySelectorAll(".tab").forEach(tab => tab.classList.remove("active"));
        if(tabId === "list") document.getElementById("listPanel").classList.add("active-panel");
        else if(tabId === "add") document.getElementById("addPanel").classList.add("active-panel");
        else if(tabId === "print") document.getElementById("printPanel").classList.add("active-panel");
        else if(tabId === "stats") document.getElementById("statsPanel").classList.add("active-panel");
        const targetTabBtn = Array.from(document.querySelectorAll(".tab")).find(btn => btn.dataset.tab === tabId);
        if(targetTabBtn) targetTabBtn.classList.add("active");
        if(tabId === "print" && documents.length>0 && !document.getElementById("selectDocument").value){
            const selectEl = document.getElementById("selectDocument");
            if(selectEl && selectEl.options.length>1) selectEl.value = documents[0].id;
        }
    }

    // イベント紐付け
    document.querySelectorAll(".tab").forEach(btn => {
        btn.addEventListener("click", () => switchTab(btn.dataset.tab));
    });
    document.getElementById("newQty")?.addEventListener("input", autoCalcAmount);
    document.getElementById("newPrice")?.addEventListener("input", autoCalcAmount);
    document.getElementById("linkCalc")?.addEventListener("change", autoCalcAmount);
    
    // 初期設定
    loadData();
    const todayStr = new Date().toISOString().split('T')[0];
    if(document.getElementById("newDate")) document.getElementById("newDate").value = todayStr;
    
    // 初回描画
    refreshAll();
</script>
